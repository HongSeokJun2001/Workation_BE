name: Deploy Workation Backend

on:
  push:
    branches: [deploy]

concurrency:
  group: workation-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: target/workation-*.jar
          target: /home/ubuntu/workation-upload
          strip_components: 1

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_LOGIN_ID: ${{ secrets.SUPER_ADMIN_LOGIN_ID }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: RDS_HOST,DB_USERNAME,DB_PASSWORD,JWT_SECRET,SUPER_ADMIN_LOGIN_ID,SUPER_ADMIN_PASSWORD,MAIL_USERNAME,MAIL_PASSWORD,GEMINI_API_KEY
          script: |
            set -e
            mkdir -p /home/ubuntu/workation-backend/uploads
            mv /home/ubuntu/workation-upload/workation-*.jar /home/ubuntu/workation-backend/workation.jar
            if [ -f /home/ubuntu/workation-backend/workation.pid ]; then
              kill "$(cat /home/ubuntu/workation-backend/workation.pid)" 2>/dev/null || true
              rm -f /home/ubuntu/workation-backend/workation.pid
              sleep 5
            fi
            cd /home/ubuntu/workation-backend
            nohup java -jar /home/ubuntu/workation-backend/workation.jar > /home/ubuntu/workation-backend/app.log 2>&1 < /dev/null &
            echo $! > /home/ubuntu/workation-backend/workation.pid
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8007/workation/public/platform/stats > /dev/null; then
                exit 0
              fi
              sleep 2
            done
            tail -n 100 /home/ubuntu/workation-backend/app.log
            exit 1