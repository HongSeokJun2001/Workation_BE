name: Deploy Workation Backend

on:
  push:
    branches: [deploy]

concurrency:
  group: workation-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: target/workation-*.jar
          target: /home/ubuntu/workation-upload
          strip_components: 1

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_LOGIN_ID: ${{ secrets.SUPER_ADMIN_LOGIN_ID }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: RDS_HOST,DB_USERNAME,DB_PASSWORD,JWT_SECRET,SUPER_ADMIN_LOGIN_ID,SUPER_ADMIN_PASSWORD,MAIL_USERNAME,MAIL_PASSWORD,GEMINI_API_KEY
          script: |
            set -e
            mkdir -p /home/ubuntu/workation-backend/uploads
            if [ -f /home/ubuntu/workation-backend/workation.jar ]; then
              cp /home/ubuntu/workation-backend/workation.jar /home/ubuntu/workation-backend/workation.previous.jar
            fi
            mv /home/ubuntu/workation-upload/workation-*.jar /home/ubuntu/workation-backend/workation.jar

            {
              printf '#!/bin/bash\n'
              printf 'export RDS_HOST=%q\n' "$RDS_HOST"
              printf 'export DB_USERNAME=%q\n' "$DB_USERNAME"
              printf 'export DB_PASSWORD=%q\n' "$DB_PASSWORD"
              printf 'export JWT_SECRET=%q\n' "$JWT_SECRET"
              printf 'export SUPER_ADMIN_LOGIN_ID=%q\n' "$SUPER_ADMIN_LOGIN_ID"
              printf 'export SUPER_ADMIN_PASSWORD=%q\n' "$SUPER_ADMIN_PASSWORD"
              printf 'export MAIL_USERNAME=%q\n' "$MAIL_USERNAME"
              printf 'export MAIL_PASSWORD=%q\n' "$MAIL_PASSWORD"
              printf 'export GEMINI_API_KEY=%q\n' "$GEMINI_API_KEY"
              printf 'exec java -jar /home/ubuntu/workation-backend/workation.jar\n'
            } > /home/ubuntu/workation-backend/start.sh
            chmod 700 /home/ubuntu/workation-backend/start.sh

            if [ -f /home/ubuntu/workation-backend/workation.pid ]; then
              kill "$(cat /home/ubuntu/workation-backend/workation.pid)" 2>/dev/null || true
              rm -f /home/ubuntu/workation-backend/workation.pid
              sleep 5
            fi

            sudo tee /etc/systemd/system/workation.service > /dev/null <<'EOF'
            [Unit]
            Description=Workation Backend
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/home/ubuntu/workation-backend
            ExecStart=/home/ubuntu/workation-backend/start.sh
            Restart=always
            RestartSec=5
            SuccessExitStatus=143

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable workation.service
            sudo systemctl restart workation.service

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8007/workation/public/platform/stats > /dev/null; then
                exit 0
              fi
              sleep 2
            done

            sudo journalctl -u workation.service -n 100 --no-pager
            if [ -f /home/ubuntu/workation-backend/workation.previous.jar ]; then
              mv /home/ubuntu/workation-backend/workation.previous.jar /home/ubuntu/workation-backend/workation.jar
              sudo systemctl restart workation.service
            fi
            exit 1