spring.application.name=Workation_BE

server.servlet.context-path=/workation
server.port=8007

# MySQL 연동 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/workation
spring.datasource.username=root
spring.datasource.password=mysql

# JPA 연동 설정
spring.jpa.hibernate.ddl-auto=update
# Entity 를 기준으로 테이블을 자동 생성/수정

spring.jpa.show-sql=true
#내부적으로 JPA 가 만들어서 실행하는 SQL 문을 콘솔에 찍어주겠다.

spring.jpa.properties.hibernate.format_sql=true
#SQL 문을 출력할 때 보기 좋게 정렬해서 출력하겠다.

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 사용할 데이터베이스(MySQL) 에 맞는 SQL 문으로 생성하겠다.

jwt.secret=${JWT_SECRET:Hello123KHAcademy456Gangnam789WelcomeToHClass0}

app.init.super-admin.login-id=${SUPER_ADMIN_LOGIN_ID:admin}
app.init.super-admin.password=${SUPER_ADMIN_PASSWORD:test}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
